name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.22.2'
      # Upgrading the runner's own npm in place breaks it on ubuntu-latest
      # (MODULE_NOT_FOUND promise-retry), so npm 11 runs through npx instead.
      - name: Install dependencies
        run: npx -y npm@11.21.1 ci
      - name: Build
        run: npx -y npm@11.21.1 run build
      - name: Test
        run: npx -y npm@11.21.1 test
