name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.2'
      # Upgrading the runner's own npm in place breaks it on ubuntu-latest
      # (MODULE_NOT_FOUND promise-retry), so npm 11 runs through npx instead.
      - name: Install dependencies
        run: npx -y npm@11.21.1 ci
      - name: Build
        run: npx -y npm@11.21.1 run build
      # The published packages run the bundled dist/; loading each setup entry checks the bundle resolves.
      - name: Bundle servers
        run: |
          npx -y npm@11.21.1 run bundle --workspace=packages/jira --workspace=packages/confluence --workspace=packages/bitbucket
          node packages/jira/bin/run.js setup --help
          node packages/confluence/bin/run.js setup --help
          node packages/bitbucket/bin/run.js setup --help
      - name: Test
        run: npx -y npm@11.21.1 test
