name: Release

# Publishing a GitHub release (tag vX.Y.Z) publishes the three servers to npm and the MCP Registry.
# Run it manually to retry: versions already on npm are skipped.
on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing and the MCP Registry both log in with the GitHub OIDC token.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.22.2'
      # See ci.yml: npm 11 runs through npx because upgrading the runner's npm in place breaks it.
      - name: Install dependencies
        run: npx -y npm@11.21.1 ci
      - name: Build
        run: npx -y npm@11.21.1 run build
      - name: Test
        run: npx -y npm@11.21.1 test
      - name: Publish to npm
        run: scripts/publish-npm.sh "${{ github.event_name == 'release' && github.event.release.tag_name || '' }}"

  mcp-registry:
    needs: npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Publish to the MCP Registry
        run: scripts/publish-mcp.sh
